name: Frontend CI - Build & Tests

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Validar compilació i proves
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositori
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instal·lar dependències
        run: npm ci

      - name: Compilar aplicació Angular
        run: npm run build
