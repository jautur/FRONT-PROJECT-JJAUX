<div class="shell">
  <header class="topbar">
    <div class="brand">JJAUX</div>
    <nav class="nav">
      <a routerLink="/">Inici</a>
      <ng-container *ngIf="!authService.isLoggedIn()">
        <a routerLink="/login">Login</a>
        <a routerLink="/registre">Registre</a>
      </ng-container>
      <ng-container *ngIf="authService.isLoggedIn()">
        <span class="user-badge">
          {{ authService.getCurrentUser()?.nom }} ({{ authService.getCurrentUser()?.rol }})
        </span>
        <button type="button" class="btn-logout" (click)="logout()">Sortir</button>
      </ng-container>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
