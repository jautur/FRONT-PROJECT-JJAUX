<div class="shell">
  <header class="topbar">
    <div class="brand">
      <a routerLink="/" class="brand-link">JJAUX</a>
    </div>

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Inici</a>

      <!-- Enllaços per a visitants no autenticats -->
      <ng-container *ngIf="!authService.isLoggedIn()">
        <a routerLink="/login" routerLinkActive="active-link">Login</a>
        <a routerLink="/registre" routerLinkActive="active-link" class="nav-highlight">Registre</a>
      </ng-container>

      <!-- Enllaços específics per a clients -->
      <ng-container *ngIf="authService.isLoggedIn() && isClient()">
        <a routerLink="/client/les-meves-tasques" routerLinkActive="active-link">Les meves tasques</a>
        <a routerLink="/client/crear-tasca" routerLinkActive="active-link" class="nav-cta">+ Publicar tasca</a>
      </ng-container>

      <!-- Enllaços específics per a professionals -->
      <ng-container *ngIf="authService.isLoggedIn() && isProfessional()">
        <a routerLink="/professional/les-meves-ofertes" routerLinkActive="active-link">Els meus pressupostos</a>
        <a routerLink="/professional/crear-oferta" routerLinkActive="active-link" class="nav-cta">+ Nova oferta</a>
      </ng-container>

      <!-- Enllaç exclusiu per a Administradors -->
      <ng-container *ngIf="authService.isLoggedIn() && isAdmin()">
        <a routerLink="/admin/panell" routerLinkActive="active-link" class="nav-admin" title="Panell d'Administració Global">
          🛡️ Panell Admin
        </a>
      </ng-container>

      <!-- Enllaços comuns per a usuaris autenticats -->
      <ng-container *ngIf="authService.isLoggedIn()">
        <!-- Botó de Notificacions amb comptador -->
        <a routerLink="/avisos" routerLinkActive="active-link" class="nav-avisos" title="Safata d'Avisos">
          🔔 Avisos
          <span class="badge-notif" *ngIf="avisosPendents > 0">{{ avisosPendents }}</span>
        </a>

        <!-- Perfil d'usuari -->
        <a routerLink="/perfil" routerLinkActive="active-link" class="nav-perfil">
          👤 {{ authService.getCurrentUser()?.nom }}
        </a>

        <span class="user-role-badge" [ngClass]="authService.getCurrentUser()?.rol">
          {{ authService.getCurrentUser()?.rol }}
        </span>

        <button type="button" class="btn-logout" (click)="logout()">Sortir</button>
      </ng-container>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
